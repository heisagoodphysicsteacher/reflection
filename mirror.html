<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirrorRay Sim | Physics & Construction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas { background-color: #ffffff; cursor: default; }
        .mode-active { background-color: #2563eb; color: white; }
        .mode-inactive { background-color: #f1f5f9; color: #475569; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <header class="bg-slate-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">MirrorRay <span class="text-blue-400">Sim</span></h1>
            <div class="flex rounded-lg overflow-hidden border border-slate-700">
                <button id="modeABtn" class="px-4 py-2 text-sm font-bold transition mode-active">Mode A: Construction</button>
                <button id="modeBBtn" class="px-4 py-2 text-sm font-bold transition mode-inactive">Mode B: Data Proof</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <div class="lg:col-span-1 space-y-4">
            <div id="panelA" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-lg mb-4">Construction Steps</h2>
                <div id="stepList" class="space-y-2">
                    <div id="step-0" class="p-2 rounded text-xs transition-all">0. Setup (Drag Eye!)</div>
                    <div id="step-1" class="p-2 rounded text-xs transition-all opacity-50">1. Virtual Image (Dotted)</div>
                    <div id="step-2" class="p-2 rounded text-xs transition-all opacity-50">2. Reflected Rays (Tip)</div>
                    <div id="step-3" class="p-2 rounded text-xs transition-all opacity-50">3. Incident Rays (Tip)</div>
                    <div id="step-4" class="p-2 rounded text-xs transition-all opacity-50">4. Tail Construction (Full)</div>
                </div>
                <div class="mt-6 flex flex-col gap-2">
                    <button id="nextBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition">Next Step</button>
                    <button id="resetBtn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded-lg transition">Reset</button>
                </div>
            </div>

            <div id="panelB" class="bg-purple-50 p-5 rounded-xl shadow-sm border border-purple-200 hidden">
                <h2 class="font-bold text-lg mb-2 text-purple-900">Physics Data</h2>
                <div class="bg-white p-4 rounded-lg border border-purple-200 space-y-3 shadow-inner">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-500 font-medium">Man Height:</span>
                        <span class="font-bold text-slate-900">1.80 m</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-500 font-medium">Eye Level:</span>
                        <span class="font-bold text-slate-900">1.70 m</span>
                    </div>
                    <div class="flex justify-between text-xs border-t pt-2">
                        <span class="text-purple-700 font-bold">Min. Mirror:</span>
                        <span class="font-black text-purple-800">0.90 m</span>
                    </div>
                </div>
                <div class="mt-4 p-3 bg-slate-800 text-white rounded text-[10px] font-mono leading-relaxed">
                    GEOMETRY:<br>
                    Mirror Height = H / 2<br>
                    1.8m / 2 = 0.9m
                </div>
            </div>

            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <p id="instructionText" class="text-xs text-blue-800 italic leading-relaxed"></p>
            </div>
        </div>

        <div class="lg:col-span-3">
            <div class="bg-white p-4 rounded-xl shadow-inner border border-slate-200 relative">
                <canvas id="mainCanvas" width="800" height="500" class="w-full h-auto"></canvas>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const instructionText = document.getElementById('instructionText');
        const modeABtn = document.getElementById('modeABtn');
        const modeBBtn = document.getElementById('modeBBtn');

        let currentMode = 'A';
        let step = 0;
        let isDragging = false;

        // Mode A Variables
        const mirrorX = 400, objectX = 220, objY1 = 180, objY2 = 320;
        const imgX = mirrorX + (mirrorX - objectX);
        let eyeX = 60, eyeY1 = 120, eyeY2 = 145;

        const instructions = [
            "Start with the object and the eye position. (Drag the eye!)",
            "Step 1: Construct the virtual image arrow using dotted lines.",
            "Step 2: Draw two lines from the eye to the tip of the image. Solid in front, dotted behind.",
            "Step 3: Draw incident rays from the object tip to the mirror points.",
            "Step 4: Full construction for the tail: 2 incident, 2 reflected, and 2 dotted extensions."
        ];

        function drawLine(x1, y1, x2, y2, color, dashed = false, arrow = false) {
            ctx.beginPath();
            ctx.setLineDash(dashed ? [5, 5] : []);
            ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            if (arrow) {
                const angle = Math.atan2(y2 - y1, x2 - x1);
                const midX = (x1 + x2) / 2; const midY = (y1 + y2) / 2;
                ctx.beginPath(); ctx.setLineDash([]);
                ctx.moveTo(midX, midY);
                ctx.lineTo(midX - 10 * Math.cos(angle - Math.PI / 6), midY - 10 * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(midX, midY);
                ctx.lineTo(midX - 10 * Math.cos(angle + Math.PI / 6), midY - 10 * Math.sin(angle + Math.PI / 6));
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        function drawObject(x, y1, y2, color, label, dashed = false) {
            drawLine(x, y1, x, y2, color, dashed);
            ctx.beginPath(); ctx.setLineDash([]);
            ctx.moveTo(x - 5, y1 + 10); ctx.lineTo(x, y1); ctx.lineTo(x + 5, y1 + 10); ctx.stroke();
            ctx.font = "12px Arial"; ctx.fillStyle = color;
            ctx.fillText(label, x - 15, y2 + 20);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (currentMode === 'A') {
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(mirrorX, 50); ctx.lineTo(mirrorX, 450); ctx.stroke();
                for(let i=50; i<450; i+=10) { ctx.beginPath(); ctx.moveTo(mirrorX, i); ctx.lineTo(mirrorX + 8, i - 8); ctx.stroke(); }
                
                // Draggable Eye Circle
                ctx.strokeStyle = isDragging ? '#3b82f6' : '#64748b';
                ctx.beginPath(); ctx.arc(eyeX, eyeY1+10, 15, 0, 7); ctx.stroke();

                drawObject(objectX, objY1, objY2, "black", "Object");
                if (step >= 1) drawObject(imgX, objY1, objY2, "#f59e0b", "Image", true);
                
                const r = (mirrorX - eyeX) / (imgX - eyeX);
                if (step >= 2) {
                    const mY1 = eyeY1 + (objY1 - eyeY1) * r;
                    const mY2 = eyeY2 + (objY1 - eyeY2) * r;
                    drawLine(imgX, objY1, mirrorX, mY1, "red", true);
                    drawLine(imgX, objY1, mirrorX, mY2, "red", true);
                    drawLine(mirrorX, mY1, eyeX, eyeY1, "blue", false, true);
                    drawLine(mirrorX, mY2, eyeX, eyeY2, "blue", false, true);
                }
                if (step >= 3) {
                    const mY1 = eyeY1 + (objY1 - eyeY1) * r;
                    const mY2 = eyeY2 + (objY1 - eyeY2) * r;
                    drawLine(objectX, objY1, mirrorX, mY1, "blue", false, true);
                    drawLine(objectX, objY1, mirrorX, mY2, "blue", false, true);
                }
                if (step >= 4) {
                    const mT1 = eyeY1 + (objY2 - eyeY1) * r;
                    const mT2 = eyeY2 + (objY2 - eyeY2) * r;
                    drawLine(imgX, objY2, mirrorX, mT1, "red", true);
                    drawLine(imgX, objY2, mirrorX, mT2, "red", true);
                    drawLine(mirrorX, mT1, eyeX, eyeY1, "green", false, true);
                    drawLine(mirrorX, mT2, eyeX, eyeY2, "green", false, true);
                    drawLine(objectX, objY2, mirrorX, mT1, "green", false, true);
                    drawLine(objectX, objY2, mirrorX, mT2, "green", false, true);
                }
                instructionText.innerText = instructions[step];
                for(let i=0; i<=4; i++) document.getElementById(`step-${i}`).className = (i === step) ? "p-2 rounded text-xs transition-all bg-blue-50 border-l-4 border-blue-500 font-bold" : "p-2 rounded text-xs transition-all opacity-50";

            } else {
                // Mode B: Metric Data Proof
                const groundY = 450;
                const scale = 200; // 1m = 200px
                const manH = 1.8, eyeH = 1.7;
                const mx = 450, px = 150, ix = mx + (mx - px);
                const topY = groundY - (manH * scale);
                const manEyeY = groundY - (eyeH * scale);

                // Draw Ground
                drawLine(50, groundY, 750, groundY, "#94a3b8");

                // Draw Stick Man
                ctx.strokeStyle = "black";
                ctx.beginPath(); ctx.arc(px, topY + 20, 15, 0, 7); ctx.stroke(); // Head
                drawLine(px, topY + 35, px, groundY, "black"); // Body
                ctx.fillStyle = "blue"; ctx.beginPath(); ctx.arc(px + 10, manEyeY, 3, 0, 7); ctx.fill(); // Eye

                // Draw Mirror
                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(mx, 50); ctx.lineTo(mx, 450); ctx.stroke();

                // Reflections
                const midHeadY = (topY + manEyeY) / 2;
                const midFeetY = (groundY + manEyeY) / 2;

                // Head Incident & Reflected
                drawLine(px, topY, mx, midHeadY, "blue", false, true); 
                drawLine(mx, midHeadY, px+10, manEyeY, "blue", false, true);
                drawLine(mx, midHeadY, ix, topY, "blue", true);

                // Feet Incident & Reflected
                drawLine(px, groundY, mx, midFeetY, "green", false, true);
                drawLine(mx, midFeetY, px+10, manEyeY, "green", false, true);
                drawLine(mx, midFeetY, ix, groundY, "green", true);

                // Highlight Active Mirror (The Data Value)
                ctx.lineWidth = 8; ctx.strokeStyle = "#a855f7";
                ctx.beginPath(); ctx.moveTo(mx, midHeadY); ctx.lineTo(mx, midFeetY); ctx.stroke();

                // Metric Labels
                ctx.font = "bold 13px Arial"; ctx.fillStyle = "black"; ctx.textAlign = "center";
                ctx.fillText("Height: 1.8 m", px - 40, (topY + groundY)/2);
                ctx.fillText("Eyes: 1.7 m", px + 60, manEyeY - 10);
                
                ctx.fillStyle = "#a855f7"; ctx.textAlign = "left";
                ctx.fillText("Mirror Length: 0.9 m", mx + 20, (midHeadY + midFeetY)/2);
                
                instructionText.innerHTML = "<b>Mode B Proof:</b> Notice that the mirror required (purple) is exactly <b>0.9 m</b> (half of 1.8 m).";
            }
        }

        canvas.onmousedown = (e) => {
            if(currentMode !== 'A') return;
            const rect = canvas.getBoundingClientRect();
            if (Math.abs((e.clientY - rect.top) - (eyeY1+10)) < 30) { isDragging = true; }
        };
        window.onmousemove = (e) => {
            if (isDragging) {
                const rect = canvas.getBoundingClientRect();
                const delta = (e.clientY - rect.top) - (eyeY1 + 10);
                eyeY1 += delta; eyeY2 += delta;
                render();
            }
        };
        window.onmouseup = () => { isDragging = false; };

        modeABtn.onclick = () => { currentMode = 'A'; document.getElementById('panelA').classList.remove('hidden'); document.getElementById('panelB').classList.add('hidden'); modeABtn.className = "px-4 py-2 text-sm font-bold mode-active"; modeBBtn.className = "px-4 py-2 text-sm font-bold mode-inactive"; render(); };
        modeBBtn.onclick = () => { currentMode = 'B'; document.getElementById('panelA').classList.add('hidden'); document.getElementById('panelB').classList.remove('hidden'); modeBBtn.className = "px-4 py-2 text-sm font-bold mode-active"; modeABtn.className = "px-4 py-2 text-sm font-bold mode-inactive"; render(); };
        document.getElementById('nextBtn').onclick = () => { if(step < 4) step++; render(); };
        document.getElementById('resetBtn').onclick = () => { step = 0; eyeY1 = 120; eyeY2 = 145; render(); };

        render();
    </script>
</body>
</html>
